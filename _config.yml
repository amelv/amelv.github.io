title: Alexa Melvin
tagline: Websites and systems that make your work easier
description: Alexa Melvin builds payment systems, custom admin tools, and WordPress sites for small businesses and nonprofits. Web developer with 7+ years of experience.
url: "https://alexamelvin.com"
baseurl: ""

permalink: pretty

collections:
  portfolio:
    output: true
    permalink: /portfolio/:slug/

defaults:
  - scope:
      path: ""
      type: portfolio
    values:
      layout: portfolio
  - scope:
      path: ""
    values:
      layout: page

formspree_id: "xeebjnbe"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
